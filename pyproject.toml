[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tbot"
version = "0.2.0"
description = "Multi-Agent AI Trading System — LangGraph orchestration with LLM backbone"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "chromadb>=0.6.0",
    "httpx>=0.28.0",
    "numpy>=1.24",
    "yfinance>=0.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "feedparser>=6.0.0",
]

[project.scripts]
tbot = "tbot.cli:main"

[tool.setuptools.package-dir]
tbot = "src/tbot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
