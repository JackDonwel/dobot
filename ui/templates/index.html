<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading System Control Center</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Integrated Trading Stack</p>
          <h1>Flask Control Center</h1>
          <p class="lede">
            Live portfolio and market data come from the Rust API gateway. Backtests run through the
            Python engine directly from this UI.
          </p>
        </div>
        <div class="status-card">
          <p>Gateway</p>
          <strong id="gateway-status">Checking...</strong>
          <span id="market-symbol">BTCUSD</span>
        </div>
      </section>

      <section class="grid">
        <article class="panel">
          <h2>Portfolio</h2>
          <div id="portfolio" class="metric-grid"></div>
        </article>

        <article class="panel">
          <h2>Market</h2>
          <div id="market" class="metric-grid"></div>
        </article>
      </section>

      <section class="panel">
        <h2>Backtest Runner</h2>
        <form id="backtest-form" class="form-grid">
          <label>
            CSV Path
            <input name="csv_path" type="text" value="data/BTCUSD_1h.csv" required />
          </label>
          <label>
            Symbol
            <input name="symbol" type="text" value="BTCUSD" />
          </label>
          <label>
            Strategy
            <select name="strategy">
              <option value="RSIMACD">RSI + MACD</option>
              <option value="BOLLINGER">Bollinger Bands</option>
            </select>
          </label>
          <label>
            Initial Balance
            <input name="initial_balance" type="number" step="0.01" value="10000" />
          </label>
          <label>
            Risk Per Trade
            <input name="risk_per_trade" type="number" step="0.001" value="0.01" />
          </label>
          <label>
            Commission
            <input name="commission" type="number" step="0.0001" value="0.001" />
          </label>
          <button type="submit">Run Backtest</button>
        </form>
        <pre id="backtest-output">Waiting for a backtest run...</pre>
      </section>

      <section class="panel">
        <h2>Realtime Events</h2>
        <div id="event-log" class="event-log"></div>
      </section>
    </main>

    <script>
      const apiBaseUrl = {{ api_base_url|tojson }};
      const eventLog = document.getElementById("event-log");
      const gatewayStatus = document.getElementById("gateway-status");
      const portfolioEl = document.getElementById("portfolio");
      const marketEl = document.getElementById("market");
      const marketSymbolEl = document.getElementById("market-symbol");
      const backtestForm = document.getElementById("backtest-form");
      const backtestOutput = document.getElementById("backtest-output");

      function renderMetrics(target, payload) {
        if (!payload) {
          target.innerHTML = "<p class='muted'>No data available</p>";
          return;
        }
        target.innerHTML = Object.entries(payload).map(([key, value]) => {
          const display = typeof value === "object" ? JSON.stringify(value) : value;
          return `<div class="metric"><span>${key}</span><strong>${display}</strong></div>`;
        }).join("");
      }

      async function loadDashboard() {
        const symbol = backtestForm.symbol.value || "BTCUSD";
        marketSymbolEl.textContent = symbol;
        try {
          const response = await fetch(`/api/dashboard?symbol=${encodeURIComponent(symbol)}`);
          const data = await response.json();
          gatewayStatus.textContent = data.errors.portfolio || data.errors.market ? "Degraded" : "Connected";
          renderMetrics(portfolioEl, data.portfolio);
          renderMetrics(marketEl, data.market);
        } catch (error) {
          gatewayStatus.textContent = "Offline";
          portfolioEl.innerHTML = `<p class="muted">${error.message}</p>`;
          marketEl.innerHTML = `<p class="muted">${error.message}</p>`;
        }
      }

      function connectWebSocket() {
        const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
        const wsHost = apiBaseUrl.replace(/^https?:\/\//, "");
        const socket = new WebSocket(`${wsScheme}://${wsHost}/ws`);

        socket.onmessage = (event) => {
          const line = document.createElement("div");
          line.className = "event-line";
          line.textContent = event.data;
          eventLog.prepend(line);
          while (eventLog.children.length > 24) {
            eventLog.removeChild(eventLog.lastChild);
          }
        };

        socket.onopen = () => {
          const line = document.createElement("div");
          line.className = "event-line ok";
          line.textContent = "WebSocket connected";
          eventLog.prepend(line);
        };

        socket.onerror = () => {
          const line = document.createElement("div");
          line.className = "event-line warn";
          line.textContent = "WebSocket unavailable";
          eventLog.prepend(line);
        };
      }

      backtestForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(backtestForm).entries());
        payload.initial_balance = Number(payload.initial_balance);
        payload.risk_per_trade = Number(payload.risk_per_trade);
        payload.commission = Number(payload.commission);

        backtestOutput.textContent = "Running backtest...";

        const response = await fetch("/api/backtest", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await response.json();
        backtestOutput.textContent = JSON.stringify(data, null, 2);
      });

      loadDashboard();
      connectWebSocket();
      setInterval(loadDashboard, 5000);
    </script>
  </body>
</html>
